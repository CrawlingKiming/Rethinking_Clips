name: Search longer Optdigits N8 trajectories

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r simulation/requirements.txt
      - name: Run long N8 trajectories
        run: |
          python - <<'PY'
          import csv
          import importlib.util
          import math
          import sys
          from pathlib import Path
          import numpy as np

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('base', root/'simulation'/'optdigits_categorical_theory.py')
          exp = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = exp
          spec.loader.exec_module(exp)
          features, labels = exp.load_optdigits(root/'simulation'/'data', False)

          candidates = []
          for learning_rate in (0.14, 0.17):
              for epsilon in (0.05, 0.10, 0.20, 0.30):
                  for init_scale in (0.20, 0.35):
                      candidates.append((learning_rate, epsilon, init_scale))

          replications = 20
          iterations = 60
          seed_start = 20430826
          rows = []

          def run(method, initial_weights, draws, cfg):
              weights = initial_weights.copy()
              values = [exp.population_value(weights, features, labels)]
              for draw in draws:
                  rollout_weights = weights.copy()
                  rollout = exp.collect_rollout(rollout_weights, features, labels, draw['contexts'], draw['uniforms'])
                  for indices in np.split(draw['order'], cfg.minibatches):
                      gradients, _, _ = exp.estimate_gradients(weights, rollout, indices, cfg)
                      weights = weights + cfg.training_learning_rate * gradients[method]
                  values.append(exp.population_value(weights, features, labels))
              return np.asarray(values)

          for candidate_id, (learning_rate, epsilon, init_scale) in enumerate(candidates):
              cfg = exp.Config(
                  rollout_cycles=iterations,
                  rollout_size=320,
                  minibatches=40,
                  training_learning_rate=learning_rate,
                  ppo_epsilon=epsilon,
                  initialization_scale=init_scale,
              )
              initial_weights = exp.fit_initial_policy(features, labels, cfg)
              raw_curves = []
              ppo_curves = []
              for replication in range(replications):
                  rng = np.random.default_rng(seed_start + 1000*candidate_id + replication)
                  draws = exp.common_randomness(rng, len(features), cfg)
                  raw_curves.append(run('raw', initial_weights, draws, cfg))
                  ppo_curves.append(run('ppo', initial_weights, draws, cfg))
              raw = np.asarray(raw_curves)
              ppo = np.asarray(ppo_curves)
              raw_mean = np.mean(raw, axis=0)
              ppo_mean = np.mean(ppo, axis=0)
              gap = raw_mean - ppo_mean
              persistent = -1
              for iteration in range(1, iterations+1):
                  if np.all(gap[iteration:] < 0.0):
                      persistent = iteration
                      break
              final_diff = raw[:, -1] - ppo[:, -1]
              rows.append({
                  'candidate_id': candidate_id,
                  'rollout_size': 320,
                  'minibatches': 40,
                  'minibatch_size': 8,
                  'policy_iterations': iterations,
                  'learning_rate': learning_rate,
                  'ppo_epsilon': epsilon,
                  'initialization_scale': init_scale,
                  'replications': replications,
                  'initial_value': raw_mean[0],
                  'raw_final': raw_mean[-1],
                  'ppo_final': ppo_mean[-1],
                  'final_raw_minus_ppo': float(np.mean(final_diff)),
                  'final_gap_se': float(np.std(final_diff, ddof=1)/math.sqrt(replications)),
                  'max_early_raw_advantage': float(np.max(gap[1:16])),
                  'max_early_iteration': int(np.argmax(gap[1:16])+1),
                  'persistent_crossover_iteration': persistent,
              })
              print(rows[-1])
          rows.sort(key=lambda r: (r['persistent_crossover_iteration'] > 0, r['max_early_raw_advantage'], -r['final_raw_minus_ppo']), reverse=True)
          path = root/'simulation'/'results'/'optdigits_long_n8_search.csv'
          with path.open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(rows[0].keys()))
              writer.writeheader()
              writer.writerows(rows)
          print('TOP')
          for row in rows:
              print(row)
          PY
      - name: Commit results and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulation/results/optdigits_long_n8_search.csv
          git rm .github/workflows/optdigits-long-n8-search.yml
          git commit -m 'Search longer Optdigits N8 trajectories'
          git push
