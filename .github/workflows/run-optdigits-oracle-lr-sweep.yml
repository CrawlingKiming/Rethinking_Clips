name: Run Optdigits oracle learning-rate sweep

on:
  push:
    branches:
      - optdigits-mse-oracle

permissions:
  contents: write

jobs:
  sweep:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optdigits-mse-oracle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r simulation/requirements.txt
      - run: python simulation/optdigits_oracle_lr_sweep.py
      - name: Commit sweep and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm simulation/optdigits_oracle_lr_sweep.py
          rm .github/workflows/run-optdigits-oracle-lr-sweep.yml
          git add -A simulation/optdigits_oracle_lr_sweep.py
          git add -A .github/workflows/run-optdigits-oracle-lr-sweep.yml
          git add simulation/results/optdigits_oracle_lr_sweep.csv
          git commit -m "Evaluate Optdigits MSE oracle across learning rates"
          git push origin HEAD:optdigits-mse-oracle
