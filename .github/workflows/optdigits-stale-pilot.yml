name: Run full-training stale-rollout Optdigits pilot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r simulation/requirements.txt
      - name: Run stale-rollout pilot
        run: python simulation/optdigits_stale_rollout.py pilot --replications 5 --seed 20700826
      - name: Commit pilot and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulation/results/optdigits_stale_pilot.csv simulation/optdigits_stale_rollout.py
          git rm .github/workflows/optdigits-stale-pilot.yml
          git commit -m 'Run full-training stale-rollout Optdigits pilot'
          git push
