name: Finalize categorical Optdigits paper section

on:
  push:
    branches:
      - optdigits-categorical-theory
    paths:
      - scripts/rewrite_optdigits_categorical_paper.py
      - .github/workflows/finalize-optdigits-categorical-paper.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite-run-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: optdigits-categorical-theory
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --upgrade numpy matplotlib

      - name: Rewrite paper and experiment
        run: python scripts/rewrite_optdigits_categorical_paper.py

      - name: Run theory experiment
        run: python simulation/optdigits_categorical_theory.py --replications 12

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended

      - name: Compile paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.tex simulation/README.md simulation/optdigits_categorical_theory.py
          git add simulation/results/optdigits_categorical_*.csv
          git add simulation/results/optdigits_categorical_summary.txt
          git add figures/optdigits_categorical_theory.pdf figures/optdigits_categorical_theory.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Replace Optdigits heuristic with categorical theory validation"
            git push origin HEAD:optdigits-categorical-theory
          fi
