name: Finalize Optdigits estimator comparison

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r simulation/requirements.txt
      - name: Remove threshold-rule wording from the updater
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/update_optdigits_theory_paper.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'The section compares the unmodified and PPO-masked gradient estimators. It does not define or tune an ESS-gated update rule.',
              'The section compares the unmodified and PPO-masked gradient estimators as two estimators of the same population gradient.',
          )
          text = text.replace(
              'No practical ESS gate is proposed or evaluated in Optdigits.',
              'No threshold-based update rule is considered in Optdigits.',
          )
          text = text.replace(
              'No practical ESS-gated algorithm is defined in Optdigits.',
              'No threshold-based switching algorithm is defined in Optdigits.',
          )
          text = text.replace(
              'No ESS-gated update rule, ESS threshold, or oracle update is evaluated in the reported Optdigits study.',
              'No threshold-based update rule or oracle update is evaluated in the reported Optdigits study.',
          )
          text = text.replace('ESS-gated', 'threshold-based')
          text = text.replace('ESS gate', 'threshold rule')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run final Optdigits experiments
        run: python simulation/optdigits_theory_validation.py --replications 100 --diagnostic-replications 40
      - name: Rewrite paper and README
        run: python scripts/update_optdigits_theory_paper.py
      - name: Remove obsolete Optdigits artifacts
        run: |
          rm -f figures/optdigits_theory_validation.pdf figures/optdigits_theory_validation.png
          rm -f figures/optdigits_mse_crossover.pdf figures/optdigits_mse_crossover.png
          rm -f figures/optdigits_categorical_theory.pdf figures/optdigits_categorical_theory.png
          rm -f figures/optdigits_categorical_control.pdf figures/optdigits_categorical_control.png
          rm -f simulation/results/optdigits_theory_*.csv simulation/results/optdigits_theory_summary.txt
          rm -f simulation/results/optdigits_crossover_*.csv
          rm -f simulation/results/optdigits_categorical_*.csv simulation/results/optdigits_categorical_summary.txt
          rm -f simulation/results/optdigits_batchsize_explore.csv simulation/results/optdigits_batchsize_holdout.csv
          rm -f simulation/results/optdigits_hparam_explore.csv simulation/results/optdigits_hparam_holdout.csv
          rm -f simulation/results/optdigits_update_level_explore.csv simulation/results/optdigits_update_level_holdout.csv
          rm -f simulation/results/optdigits_safe_step_explore.csv simulation/results/optdigits_curvature_check.csv
          rm -f simulation/results/optdigits_certified_refine.csv
          rm -f simulation/results/optdigits_certified_curve_explore.csv simulation/results/optdigits_certified_curve_summary.csv
          rm -f simulation/results/optdigits_oracle_lr_sweep.csv
      - name: Validate paper structure
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('main.tex').read_text(encoding='utf-8')
          start = text.index(r'\section{Theoretical validation on Optdigits}')
          end = text.index(r'\section{Language-model evidence for delayed failure and recovery}')
          section = text[start:end]
          assert 'ESS gate' not in section
          assert 'ESS-gated' not in section
          assert 'MSE oracle' not in section
          assert 'optdigits_estimator_comparison.pdf' in section
          assert 'optdigits_certified_learning.pdf' in section
          assert '40 minibatch updates' in section
          assert '0.17' in section
          assert '—' not in text
          assert '---' not in text
          PY
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      - name: Compile paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Commit validated revision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.tex simulation/README.md simulation/optdigits_theory_validation.py scripts/update_optdigits_theory_paper.py
          git add simulation/results/optdigits_estimator_*.csv simulation/results/optdigits_estimator_summary.txt
          git add simulation/results/optdigits_certified_learning_*.csv
          git add figures/optdigits_estimator_comparison.pdf figures/optdigits_estimator_comparison.png
          git add figures/optdigits_certified_learning.pdf figures/optdigits_certified_learning.png
          git add -u
          git rm .github/workflows/finalize-optdigits-estimator.yml
          git commit -m 'Finalize Optdigits PPO estimator validation'
          git push
