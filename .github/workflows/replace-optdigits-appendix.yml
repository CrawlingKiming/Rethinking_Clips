name: Replace legacy Optdigits appendix

on:
  push:
    branches:
      - optdigits-categorical-theory
    paths:
      - scripts/replace_optdigits_appendix.py
      - .github/workflows/replace-optdigits-appendix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: optdigits-categorical-theory
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Replace appendix
        run: python scripts/replace_optdigits_appendix.py

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended

      - name: Compile paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Commit validated paper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.tex
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Replace legacy Optdigits appendix with categorical protocol"
            git push origin HEAD:optdigits-categorical-theory
          fi
