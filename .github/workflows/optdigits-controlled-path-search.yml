name: Search controlled Optdigits mismatch path

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r simulation/requirements.txt
      - name: Evaluate controlled policy mismatch paths
        run: |
          python - <<'PY'
          import csv
          import importlib.util
          import sys
          from dataclasses import replace
          from pathlib import Path
          import numpy as np

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location(
              'optdigits_base', root/'simulation'/'optdigits_categorical_theory.py'
          )
          exp = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = exp
          spec.loader.exec_module(exp)
          features, labels = exp.load_optdigits(root/'simulation'/'data', False)

          base_cfg = exp.Config(initialization_scale=0.20)
          rollout_weights = exp.fit_initial_policy(features, labels, base_cfg)
          full_weights = exp.fit_initial_policy(
              features, labels, replace(base_cfg, initialization_scale=1.00)
          )
          direction = full_weights - rollout_weights

          rows = []
          for batch_size in (4, 8, 16, 40, 80):
              for epsilon in (0.05, 0.10, 0.20, 0.30):
                  cfg = replace(base_cfg, ppo_epsilon=epsilon)
                  for scale in np.linspace(0.0, 2.5, 101):
                      weights = rollout_weights + scale * direction
                      rho = exp.population_rho(weights, rollout_weights, features)
                      risks = exp.exact_estimator_risks(
                          weights,
                          rollout_weights,
                          features,
                          labels,
                          batch_size,
                          cfg,
                      )
                      value, gradient = exp.population_value_and_gradient(
                          weights, features, labels
                      )
                      rows.append({
                          'batch_size': batch_size,
                          'ppo_epsilon': epsilon,
                          'path_scale': scale,
                          'population_rho': rho,
                          'population_value': value,
                          'signal_sq': float(np.sum(gradient**2)),
                          'raw_risk': risks['raw_risk'],
                          'ppo_risk': risks['ppo_risk'],
                          'risk_ratio': risks['ppo_risk'] / max(risks['raw_risk'], 1e-16),
                          'raw_bias_sq': risks['raw_bias_sq'],
                          'ppo_bias_sq': risks['ppo_bias_sq'],
                          'raw_variance': risks['raw_variance'],
                          'ppo_variance': risks['ppo_variance'],
                      })

          output = root/'simulation'/'results'/'optdigits_controlled_path_search.csv'
          with output.open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(rows[0].keys()))
              writer.writeheader()
              writer.writerows(rows)

          print('SUMMARY')
          for batch_size in (4, 8, 16, 40, 80):
              for epsilon in (0.05, 0.10, 0.20, 0.30):
                  selected = [r for r in rows if r['batch_size'] == batch_size and r['ppo_epsilon'] == epsilon]
                  raw_better = [r for r in selected if r['risk_ratio'] > 1.0 + 1e-8]
                  ppo_better = [r for r in selected if r['risk_ratio'] < 1.0 - 1e-8]
                  if raw_better and ppo_better:
                      print({
                          'batch_size': batch_size,
                          'epsilon': epsilon,
                          'max_ratio': max(r['risk_ratio'] for r in selected),
                          'min_ratio': min(r['risk_ratio'] for r in selected),
                          'raw_better_rho_range': (min(r['population_rho'] for r in raw_better), max(r['population_rho'] for r in raw_better)),
                          'ppo_better_rho_range': (min(r['population_rho'] for r in ppo_better), max(r['population_rho'] for r in ppo_better)),
                      })
          PY
      - name: Commit search and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulation/results/optdigits_controlled_path_search.csv
          git rm .github/workflows/optdigits-controlled-path-search.yml
          git commit -m 'Search controlled Optdigits mismatch path'
          git push
