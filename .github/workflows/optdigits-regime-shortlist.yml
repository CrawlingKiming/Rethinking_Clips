name: Summarize Optdigits regime search

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create compact shortlist
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          source = Path('simulation/results/optdigits_regime_search.csv')
          with source.open(encoding='utf-8') as handle:
              rows = list(csv.DictReader(handle))

          numeric = {
              'rollout_size', 'minibatches', 'minibatch_size', 'learning_rate',
              'ppo_epsilon', 'initialization_scale', 'initial_value', 'raw_final',
              'ppo_final', 'early_gap_raw_minus_ppo', 'middle_gap_raw_minus_ppo',
              'late_gap_raw_minus_ppo', 'sign_crossover',
              'early_risk_margin_ppo_minus_raw', 'late_risk_margin_raw_minus_ppo',
              'risk_crossover', 'early_endpoint_rho', 'late_endpoint_rho',
              'support_drop', 'score'
          }
          for row in rows:
              for key in numeric:
                  row[key] = float(row[key])

          def compact(row):
              return {key: row[key] for key in (
                  'config_id', 'rollout_size', 'minibatches', 'minibatch_size',
                  'learning_rate', 'ppo_epsilon', 'initialization_scale',
                  'initial_value', 'raw_final', 'ppo_final',
                  'early_gap_raw_minus_ppo', 'middle_gap_raw_minus_ppo',
                  'late_gap_raw_minus_ppo', 'sign_crossover',
                  'early_risk_margin_ppo_minus_raw',
                  'late_risk_margin_raw_minus_ppo', 'risk_crossover',
                  'early_endpoint_rho', 'late_endpoint_rho', 'support_drop', 'score'
              )}

          groups = []
          both = [r for r in rows if r['sign_crossover'] == 1.0 and r['risk_crossover'] == 1.0]
          both.sort(key=lambda r: r['score'], reverse=True)
          for rank, row in enumerate(both[:20], start=1):
              item = {'group': 'both_crossovers', 'rank': rank}
              item.update(compact(row))
              groups.append(item)

          perf = [r for r in rows if r['sign_crossover'] == 1.0]
          perf.sort(key=lambda r: r['score'], reverse=True)
          for rank, row in enumerate(perf[:20], start=1):
              item = {'group': 'performance_crossover', 'rank': rank}
              item.update(compact(row))
              groups.append(item)

          risk = [r for r in rows if r['risk_crossover'] == 1.0]
          risk.sort(key=lambda r: r['score'], reverse=True)
          for rank, row in enumerate(risk[:20], start=1):
              item = {'group': 'risk_crossover', 'rank': rank}
              item.update(compact(row))
              groups.append(item)

          reasonable = [
              r for r in rows
              if r['minibatch_size'] >= 8
              and r['sign_crossover'] == 1.0
          ]
          reasonable.sort(key=lambda r: r['score'], reverse=True)
          for rank, row in enumerate(reasonable[:20], start=1):
              item = {'group': 'performance_crossover_mb_ge_8', 'rank': rank}
              item.update(compact(row))
              groups.append(item)

          output = Path('simulation/results/optdigits_regime_shortlist.csv')
          with output.open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(groups[0].keys()))
              writer.writeheader()
              writer.writerows(groups)

          print('both_crossovers', len(both))
          print('performance_crossovers', len(perf))
          print('risk_crossovers', len(risk))
          for row in groups[:20]:
              print(row)
          PY
      - name: Commit shortlist and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulation/results/optdigits_regime_shortlist.csv
          git rm .github/workflows/optdigits-regime-shortlist.yml
          git commit -m 'Summarize Optdigits regime search'
          git push
