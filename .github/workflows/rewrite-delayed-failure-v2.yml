name: Rewrite delayed-failure framework v2

on:
  push:
    branches:
      - rewrite-delayed-failure-framework
    paths:
      - scripts/rewrite_delayed_failure.py
      - .github/workflows/rewrite-delayed-failure-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out rewrite branch
        uses: actions/checkout@v4
        with:
          ref: rewrite-delayed-failure-framework

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rewrite the paper
        run: |
          sed -i '/        "ESS",/d' scripts/rewrite_delayed_failure.py
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/rewrite_delayed_failure.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(r"\end{abstract}'''", "'''", 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile scripts/rewrite_delayed_failure.py
          python scripts/rewrite_delayed_failure.py
          python - <<'PY'
          from pathlib import Path

          p = Path('main.tex')
          s = p.read_text(encoding='utf-8')

          # JSON transport can encode a lone "\f" as a form-feed character.
          # Restore the intended LaTeX command prefix everywhere.
          s = s.replace('\x0c', r'\f')

          old_title = "\\title{\\bf When Does Clipping Help?\\\\\nEffective Sample Size and Policy-Gradient Reliability}"
          new_title = "\\title{\\bf When Does Permissive Policy Optimization Fail?\\\\\nEffective Sample Size and Gradient Reliability in RLVR}"
          s = s.replace(old_title, new_title)
          s = s.replace("\\newtheorem{assumption}[theorem]{Assumption}\n", "")

          if '\x0c' in s:
              raise RuntimeError('A form-feed control character remains in main.tex')
          if "\\newtheorem{assumption}" in s or "\\begin{assumption}" in s:
              raise RuntimeError('The numbered assumption environment survived')
          if 'When Does Clipping Help?' in s:
              raise RuntimeError('The old paper title survived')

          intro = s.split('\\section{Introduction}', 1)[1].split('\\section{Related work}', 1)[0]
          for token in ('$', '\\begin{equation}', '\\begin{align}', '\\[', '\\('):
              if token in intro:
                  raise RuntimeError(f'Introduction contains mathematics: {token}')
          for term in ('effective sample size', 'importance sampling', 'variance', 'bias',
                       'gradient', 'trust region', 'surrogate', 'divergence'):
              if term.lower() in intro.lower():
                  raise RuntimeError(f'Introduction contains technical jargon: {term}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Commit rewritten paper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.tex references.bib
          git diff --cached --quiet && exit 0
          git commit -m "Rewrite paper around delayed failure and effective support"
          git push origin HEAD:rewrite-delayed-failure-framework
