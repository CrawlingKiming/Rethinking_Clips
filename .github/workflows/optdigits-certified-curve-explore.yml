name: Explore 40-update certified Optdigits curve

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r simulation/requirements.txt
      - name: Run 40-update exploration
        run: |
          python - <<'PY'
          import csv
          import importlib.util
          import math
          import sys
          from pathlib import Path
          import numpy as np

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('optdigits_base', root/'simulation'/'optdigits_categorical_theory.py')
          exp = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = exp
          spec.loader.exec_module(exp)

          config = exp.Config(
              replications=20,
              rollout_cycles=5,
              rollout_size=320,
              minibatches=8,
              training_learning_rate=0.17,
          )
          features, labels = exp.load_optdigits(root/'simulation'/'data', False)
          initial_weights = exp.fit_initial_policy(features, labels, config)
          rows = []
          summaries = []
          seed_start = 20350826
          for replication in range(config.replications):
              rng = np.random.default_rng(seed_start + replication)
              draws = exp.common_randomness(rng, len(features), config)
              for method in ('raw', 'ppo', 'mse_oracle'):
                  _, path, summary = exp.run_trajectory(
                      method,
                      initial_weights,
                      features,
                      labels,
                      draws,
                      config,
                      replication,
                      0,
                      collect_states=False,
                  )
                  rows.extend(path)
                  summaries.append(summary)

          output = root/'simulation'/'results'/'optdigits_certified_curve_explore.csv'
          with output.open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(rows[0].keys()))
              writer.writeheader()
              writer.writerows(rows)
          summary_output = root/'simulation'/'results'/'optdigits_certified_curve_summary.csv'
          with summary_output.open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(summaries[0].keys()))
              writer.writeheader()
              writer.writerows(summaries)

          for method in ('raw', 'ppo', 'mse_oracle'):
              values = np.asarray([row['final_value'] for row in summaries if row['method'] == method])
              fractions = np.asarray([row['ppo_fraction'] for row in summaries if row['method'] == method])
              se = np.std(values, ddof=1) / math.sqrt(len(values))
              print(method, np.mean(values), se, np.mean(fractions))
          PY
      - name: Commit sweep and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulation/results/optdigits_certified_curve_explore.csv simulation/results/optdigits_certified_curve_summary.csv
          git rm .github/workflows/optdigits-certified-curve-explore.yml
          git commit -m 'Explore 40-update certified Optdigits curve'
          git push
