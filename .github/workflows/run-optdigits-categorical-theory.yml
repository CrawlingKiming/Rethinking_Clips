name: Run categorical Optdigits theory experiment

on:
  push:
    branches:
      - optdigits-categorical-theory
    paths:
      - simulation/optdigits_categorical_theory.py
      - .github/workflows/run-optdigits-categorical-theory.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: optdigits-categorical-theory
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade numpy matplotlib

      - name: Run categorical Optdigits experiment
        run: python simulation/optdigits_categorical_theory.py --replications 12

      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation/results/optdigits_categorical_*.csv
          git add simulation/results/optdigits_categorical_summary.txt
          git add figures/optdigits_categorical_theory.pdf
          git add figures/optdigits_categorical_theory.png
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Run categorical Optdigits theory experiment"
            git push origin HEAD:optdigits-categorical-theory
          fi
