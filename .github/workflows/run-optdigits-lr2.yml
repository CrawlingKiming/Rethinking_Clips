name: Run Optdigits study at theory-aligned learning rate

on:
  push:
    branches:
      - optdigits-mse-oracle

permissions:
  contents: write

jobs:
  run-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optdigits-mse-oracle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r simulation/requirements.txt
      - name: Set learning rate and run experiment
        run: |
          sed -i 's/training_learning_rate: float = 3.0/training_learning_rate: float = 2.0/' simulation/optdigits_categorical_theory.py
          python simulation/optdigits_categorical_theory.py --replications 100
      - name: Commit validated results and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/run-optdigits-lr2.yml
          git add simulation/optdigits_categorical_theory.py
          git add figures/optdigits_categorical_theory.pdf
          git add figures/optdigits_categorical_theory.png
          git add figures/optdigits_categorical_control.pdf
          git add figures/optdigits_categorical_control.png
          git add simulation/results/optdigits_categorical_*.csv
          git add simulation/results/optdigits_categorical_summary.txt
          git add -A .github/workflows/run-optdigits-lr2.yml
          git commit -m "Run Optdigits MSE-oracle study at learning rate 2"
          git push origin HEAD:optdigits-mse-oracle
