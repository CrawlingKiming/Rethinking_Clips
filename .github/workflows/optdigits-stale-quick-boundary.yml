name: Run quick stale-rollout boundary scan
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r simulation/requirements.txt
      - run: python simulation/optdigits_stale_quick_boundary.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulation/optdigits_stale_quick_boundary.py simulation/results/optdigits_stale_quick_boundary.csv
          git rm .github/workflows/optdigits-stale-quick-boundary.yml
          git commit -m 'Run quick stale-rollout boundary scan'
          git pull --rebase origin main
          git push
