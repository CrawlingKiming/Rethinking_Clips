name: Revise preliminaries and theory

on:
  push:
    branches:
      - revise-prelim-theory-clipping
    paths:
      - scripts/revise_prelim_theory_clipping.py
      - .github/workflows/revise-prelim-theory-clipping.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out rewrite branch
        uses: actions/checkout@v4
        with:
          ref: revise-prelim-theory-clipping

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rewrite paper
        run: |
          python -m py_compile scripts/revise_prelim_theory_clipping.py
          python scripts/revise_prelim_theory_clipping.py

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Commit rewritten paper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.tex
          git diff --cached --quiet && exit 0
          git commit -m "Revise preliminaries and simplify theory notation"
          git push origin HEAD:revise-prelim-theory-clipping
