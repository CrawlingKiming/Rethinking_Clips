name: Refocus Optdigits on theoretical validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r simulation/requirements.txt
      - name: Run theory-only Optdigits experiments
        run: python simulation/optdigits_theory_validation.py --replications 100 --diagnostic-replications 40
      - name: Rewrite paper and simulation documentation
        run: python scripts/update_optdigits_theory_paper.py
      - name: Remove obsolete ESS-gate artifacts
        run: |
          rm -f figures/optdigits_categorical_control.pdf figures/optdigits_categorical_control.png
          rm -f figures/optdigits_categorical_theory.pdf figures/optdigits_categorical_theory.png
          rm -f simulation/results/optdigits_categorical_*.csv
          rm -f simulation/results/optdigits_categorical_summary.txt
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      - name: Compile paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Commit validated theory-only revision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.tex simulation/README.md simulation/optdigits_theory_validation.py scripts/update_optdigits_theory_paper.py
          git add simulation/results/optdigits_theory_*.csv simulation/results/optdigits_theory_summary.txt
          git add simulation/results/optdigits_crossover_*.csv
          git add figures/optdigits_theory_validation.pdf figures/optdigits_theory_validation.png
          git add figures/optdigits_mse_crossover.pdf figures/optdigits_mse_crossover.png
          git add -u
          git rm .github/workflows/optdigits-theory-only.yml
          git commit -m 'Refocus Optdigits on theoretical validation'
          git push
