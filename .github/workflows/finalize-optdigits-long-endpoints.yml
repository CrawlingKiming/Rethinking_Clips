name: Finalize Optdigits long endpoints

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r simulation/requirements.txt
      - name: Recompute estimator-level validation
        run: |
          python simulation/optdigits_theory_validation.py --replications 100 --diagnostic-replications 40
          python simulation/optdigits_final_figures.py
      - name: Select and validate long policy-iteration design
        run: |
          python simulation/optdigits_endpoint_selection.py \
            --exploration-replications 8 \
            --validation-replications 25 \
            --final-replications 100
      - name: Rewrite paper
        run: python scripts/update_optdigits_endpoint_paper.py
      - name: Remove superseded Optdigits artifacts
        run: |
          rm -f figures/optdigits_certified_learning.pdf figures/optdigits_certified_learning.png
          rm -f simulation/results/optdigits_certified_learning_*.csv
          rm -f simulation/results/optdigits_estimator_ess_bins.csv
          rm -f simulation/results/optdigits_estimator_error_bins.csv
          rm -f simulation/results/optdigits_certified_learning_pairwise.csv
          rm -f simulation/results/optdigits_certified_learning_runs.csv
          rm -f scripts/update_optdigits_theory_paper.py
      - name: Validate reported transition and paper structure
        run: |
          python - <<'PY'
          from pathlib import Path

          summary = {}
          for line in Path('simulation/results/optdigits_endpoint_summary.txt').read_text().splitlines():
              key, value = line.split('=', 1)
              summary[key] = float(value)
          assert summary['transition_visible'] == 1.0
          assert summary['learning_rate'] <= summary['certified_eta_max']
          assert summary['early_raw_minus_ppo'] > 0.0
          assert summary['late_raw_minus_ppo'] < 0.0
          assert summary['final_raw_minus_ppo'] < 0.0
          assert summary['early_minimum_ess'] > summary['late_minimum_ess']

          text = Path('main.tex').read_text(encoding='utf-8')
          start = text.index(r'\section{Theoretical validation on Optdigits}')
          end = text.index(r'\section{Language-model evidence for delayed failure and recovery}')
          section = text[start:end]
          assert 'optdigits_policy_iteration_endpoints.pdf' in section
          assert 'optdigits_certified_learning.pdf' not in section
          assert 'policy iteration' in section.lower()
          assert 'MSE oracle' not in section
          assert 'ESS gate' not in section
          assert '—' not in text
          assert '---' not in text
          PY
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      - name: Compile paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Commit validated revision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.tex simulation/README.md
          git add simulation/optdigits_theory_validation.py simulation/optdigits_final_figures.py simulation/optdigits_endpoint_selection.py
          git add scripts/update_optdigits_endpoint_paper.py
          git add simulation/results/optdigits_estimator_states.csv simulation/results/optdigits_estimator_redraws.csv
          git add simulation/results/optdigits_estimator_robust_bins.csv simulation/results/optdigits_estimator_robust_summary.txt
          git add simulation/results/optdigits_endpoint_design_search.csv
          git add simulation/results/optdigits_endpoint_holdout_paths.csv simulation/results/optdigits_endpoint_holdout_curve.csv
          git add simulation/results/optdigits_endpoint_summary.txt simulation/results/optdigits_endpoint_selected_config.json
          git add figures/optdigits_estimator_comparison.pdf figures/optdigits_estimator_comparison.png
          git add figures/optdigits_policy_iteration_endpoints.pdf figures/optdigits_policy_iteration_endpoints.png
          git add -u
          git rm .github/workflows/finalize-optdigits-long-endpoints.yml
          git commit -m 'Show Optdigits estimator regime transition'
          git push
