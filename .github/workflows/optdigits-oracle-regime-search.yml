name: Run broadened oracle pilot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r simulation/requirements.txt
      - name: Run theorem-compliant oracle pilot
        run: python simulation/optdigits_oracle_regime_search.py
      - name: Commit search and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulation/optdigits_oracle_regime_search.py simulation/results/optdigits_oracle_regime_search.csv
          git rm .github/workflows/optdigits-oracle-regime-search.yml
          git commit -m 'Broaden theorem-compliant oracle pilot'
          git push
