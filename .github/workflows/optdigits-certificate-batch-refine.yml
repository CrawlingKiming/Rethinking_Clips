name: Refine Optdigits certificate batch size

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r simulation/requirements.txt
      - name: Refine batch size
        run: |
          python - <<'PY'
          import csv
          import importlib.util
          import math
          import sys
          from dataclasses import replace
          from pathlib import Path
          import numpy as np

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('base', root/'simulation'/'optdigits_categorical_theory.py')
          exp = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = exp
          spec.loader.exec_module(exp)
          features, labels = exp.load_optdigits(root/'simulation'/'data', False)
          cfg = exp.Config(initialization_scale=0.20, ppo_epsilon=0.20)
          rollout = exp.fit_initial_policy(features, labels, cfg)
          target = exp.fit_initial_policy(features, labels, replace(cfg, initialization_scale=1.00))
          direction = target - rollout
          rows = []
          for batch_size in (220, 240, 260, 280, 300, 320):
              path = []
              for scale in np.linspace(0.0, 2.5, 401):
                  weights = rollout + scale * direction
                  rho = exp.population_rho(weights, rollout, features)
                  _, gradient = exp.population_value_and_gradient(weights, features, labels)
                  signal_sq = float(np.sum(gradient**2))
                  risks = exp.exact_estimator_risks(weights, rollout, features, labels, batch_size, cfg)
                  raw_relative = risks['raw_risk']/max(signal_sq,1e-16)
                  ppo_relative = risks['ppo_risk']/max(signal_sq,1e-16)
                  path.append((rho, raw_relative, ppo_relative))
              raw_loss = next((item for item in path if item[1] >= 1.0), path[-1])
              ppo_loss = next((item for item in path if item[2] >= 1.0), path[-1])
              ppo_only = [item for item in path if item[1] >= 1.0 and item[2] < 1.0]
              rows.append({
                  'batch_size': batch_size,
                  'high_raw_relative_risk': path[0][1],
                  'raw_loss_rho': raw_loss[0],
                  'ppo_loss_rho': ppo_loss[0],
                  'ppo_only_rho_min': min((item[0] for item in ppo_only), default=math.nan),
                  'ppo_only_rho_max': max((item[0] for item in ppo_only), default=math.nan),
                  'ppo_only_width': max((item[0] for item in ppo_only), default=math.nan) - min((item[0] for item in ppo_only), default=math.nan) if ppo_only else math.nan,
                  'ppo_only_points': len(ppo_only),
              })
              print(rows[-1])
          out = root/'simulation'/'results'/'optdigits_certificate_batch_refine.csv'
          with out.open('w',newline='',encoding='utf-8') as handle:
              writer=csv.DictWriter(handle,fieldnames=list(rows[0].keys()))
              writer.writeheader(); writer.writerows(rows)
          PY
      - name: Commit result and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulation/results/optdigits_certificate_batch_refine.csv
          git rm .github/workflows/optdigits-certificate-batch-refine.yml
          git commit -m 'Refine Optdigits certificate batch size'
          git push
