name: Search Optdigits policy-iteration regimes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r simulation/requirements.txt
      - name: Run exploratory regime search
        run: |
          python - <<'PY'
          import csv
          import importlib.util
          import math
          import sys
          from dataclasses import replace
          from pathlib import Path
          import numpy as np

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location(
              'optdigits_base', root/'simulation'/'optdigits_categorical_theory.py'
          )
          exp = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = exp
          spec.loader.exec_module(exp)

          features, labels = exp.load_optdigits(root/'simulation'/'data', False)
          covariance = features.T @ features / len(features)
          lambda_max = float(np.linalg.eigvalsh(covariance)[-1])
          L_bound = 0.5 * lambda_max
          eta_max = 1.0 / L_bound

          policy_iterations = 15
          replications = 3
          seed_start = 20370826
          risk_iterations = {1, 2, 3, 13, 14, 15}

          configs = []
          for rollout_size in (160, 320):
              for minibatches in (8, 16, 40):
                  if rollout_size % minibatches:
                      continue
                  for learning_rate in (0.14, 0.17):
                      for epsilon in (0.05, 0.10, 0.20):
                          for init_scale in (0.20, 0.35, 0.50):
                              configs.append((rollout_size, minibatches, learning_rate, epsilon, init_scale))

          def run_method(method, initial_weights, draws, cfg, collect_risk):
              weights = initial_weights.copy()
              values = [exp.population_value(weights, features, labels)]
              endpoint_rho = []
              risk_margin = []
              for iteration, draw in enumerate(draws, start=1):
                  rollout_weights = weights.copy()
                  rollout = exp.collect_rollout(
                      rollout_weights,
                      features,
                      labels,
                      draw['contexts'],
                      draw['uniforms'],
                  )
                  minibatches = np.split(draw['order'], cfg.minibatches)
                  last_rho = 1.0
                  last_margin = float('nan')
                  for minibatch_index, indices in enumerate(minibatches, start=1):
                      last_rho = exp.population_rho(weights, rollout_weights, features)
                      if (
                          collect_risk
                          and iteration in risk_iterations
                          and minibatch_index == cfg.minibatches
                      ):
                          risks = exp.exact_estimator_risks(
                              weights,
                              rollout_weights,
                              features,
                              labels,
                              len(indices),
                              cfg,
                          )
                          last_margin = risks['ppo_risk'] - risks['raw_risk']
                      gradients, _, _ = exp.estimate_gradients(
                          weights, rollout, indices, cfg
                      )
                      weights = weights + cfg.training_learning_rate * gradients[method]
                  values.append(exp.population_value(weights, features, labels))
                  endpoint_rho.append(last_rho)
                  risk_margin.append(last_margin)
              return np.asarray(values), np.asarray(endpoint_rho), np.asarray(risk_margin)

          rows = []
          for config_id, (rollout_size, minibatches, learning_rate, epsilon, init_scale) in enumerate(configs):
              cfg = exp.Config(
                  replications=replications,
                  rollout_cycles=policy_iterations,
                  rollout_size=rollout_size,
                  minibatches=minibatches,
                  training_learning_rate=learning_rate,
                  ppo_epsilon=epsilon,
                  initialization_scale=init_scale,
              )
              initial_weights = exp.fit_initial_policy(features, labels, cfg)
              raw_curves = []
              ppo_curves = []
              rho_curves = []
              risk_curves = []
              for replication in range(replications):
                  rng = np.random.default_rng(seed_start + 1000 * config_id + replication)
                  draws = exp.common_randomness(rng, len(features), cfg)
                  raw_values, raw_rho, raw_risk = run_method(
                      'raw', initial_weights, draws, cfg, True
                  )
                  ppo_values, _, _ = run_method(
                      'ppo', initial_weights, draws, cfg, False
                  )
                  raw_curves.append(raw_values)
                  ppo_curves.append(ppo_values)
                  rho_curves.append(raw_rho)
                  risk_curves.append(raw_risk)

              raw_curve = np.mean(np.asarray(raw_curves), axis=0)
              ppo_curve = np.mean(np.asarray(ppo_curves), axis=0)
              rho_curve = np.mean(np.asarray(rho_curves), axis=0)
              risk_curve = np.nanmean(np.asarray(risk_curves), axis=0)
              gap = raw_curve - ppo_curve
              early_gap = float(np.mean(gap[1:4]))
              middle_gap = float(np.mean(gap[6:10]))
              late_gap = float(np.mean(gap[-3:]))
              early_raw_risk_advantage = float(np.nanmean(risk_curve[:3]))
              late_ppo_risk_advantage = float(-np.nanmean(risk_curve[-3:]))
              sign_crossover = float(early_gap > 0.0 and late_gap < 0.0)
              risk_crossover = float(
                  early_raw_risk_advantage > 0.0 and late_ppo_risk_advantage > 0.0
              )
              raw_gain = float(raw_curve[-1] - raw_curve[0])
              ppo_gain = float(ppo_curve[-1] - ppo_curve[0])
              support_drop = float(np.mean(rho_curve[:3]) - np.mean(rho_curve[-3:]))
              score = (
                  100.0 * max(early_gap, 0.0)
                  + 100.0 * max(-late_gap, 0.0)
                  + 10.0 * sign_crossover
                  + 5.0 * risk_crossover
                  + max(support_drop, 0.0)
                  + 0.25 * max(raw_gain, 0.0)
                  + 0.25 * max(ppo_gain, 0.0)
              )
              row = {
                  'config_id': config_id,
                  'rollout_size': rollout_size,
                  'minibatches': minibatches,
                  'minibatch_size': cfg.minibatch_size,
                  'policy_iterations': policy_iterations,
                  'learning_rate': learning_rate,
                  'eta_max': eta_max,
                  'condition_holds': float(learning_rate <= eta_max),
                  'ppo_epsilon': epsilon,
                  'initialization_scale': init_scale,
                  'replications': replications,
                  'initial_value': raw_curve[0],
                  'raw_final': raw_curve[-1],
                  'ppo_final': ppo_curve[-1],
                  'raw_gain': raw_gain,
                  'ppo_gain': ppo_gain,
                  'early_gap_raw_minus_ppo': early_gap,
                  'middle_gap_raw_minus_ppo': middle_gap,
                  'late_gap_raw_minus_ppo': late_gap,
                  'sign_crossover': sign_crossover,
                  'early_risk_margin_ppo_minus_raw': early_raw_risk_advantage,
                  'late_risk_margin_raw_minus_ppo': late_ppo_risk_advantage,
                  'risk_crossover': risk_crossover,
                  'early_endpoint_rho': float(np.mean(rho_curve[:3])),
                  'late_endpoint_rho': float(np.mean(rho_curve[-3:])),
                  'support_drop': support_drop,
                  'score': score,
              }
              for iteration in range(policy_iterations + 1):
                  row[f'raw_value_{iteration}'] = float(raw_curve[iteration])
                  row[f'ppo_value_{iteration}'] = float(ppo_curve[iteration])
                  if iteration > 0:
                      row[f'raw_endpoint_rho_{iteration}'] = float(rho_curve[iteration - 1])
              rows.append(row)
              print(row)

          rows.sort(key=lambda row: row['score'], reverse=True)
          output = root/'simulation'/'results'/'optdigits_regime_search.csv'
          output.parent.mkdir(parents=True, exist_ok=True)
          with output.open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(rows[0].keys()))
              writer.writeheader()
              writer.writerows(rows)
          print('TOP CONFIGURATIONS')
          for row in rows[:15]:
              print(row)
          PY
      - name: Commit search and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulation/results/optdigits_regime_search.csv
          git rm .github/workflows/optdigits-regime-search.yml
          git commit -m 'Search Optdigits policy-iteration regimes'
          git push
