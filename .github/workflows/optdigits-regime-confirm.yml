name: Confirm Optdigits regime candidates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r simulation/requirements.txt
      - name: Run confirmation on fresh seeds
        run: |
          python - <<'PY'
          import csv
          import importlib.util
          import math
          import sys
          from pathlib import Path
          import numpy as np

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location(
              'optdigits_base', root/'simulation'/'optdigits_categorical_theory.py'
          )
          exp = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = exp
          spec.loader.exec_module(exp)
          features, labels = exp.load_optdigits(root/'simulation'/'data', False)

          candidates = [
              {'name': 'A_320_40_lr014_eps020', 'rollout_size': 320, 'minibatches': 40, 'learning_rate': 0.14, 'epsilon': 0.20, 'init_scale': 0.20},
              {'name': 'B_160_40_lr014_eps010', 'rollout_size': 160, 'minibatches': 40, 'learning_rate': 0.14, 'epsilon': 0.10, 'init_scale': 0.20},
              {'name': 'C_160_40_lr017_eps020', 'rollout_size': 160, 'minibatches': 40, 'learning_rate': 0.17, 'epsilon': 0.20, 'init_scale': 0.20},
              {'name': 'D_320_40_lr017_eps020', 'rollout_size': 320, 'minibatches': 40, 'learning_rate': 0.17, 'epsilon': 0.20, 'init_scale': 0.20},
          ]
          replications = 30
          policy_iterations = 25
          seed_start = 20380826
          curve_rows = []
          summary_rows = []

          def run_method(method, initial_weights, draws, cfg):
              weights = initial_weights.copy()
              values = [exp.population_value(weights, features, labels)]
              endpoint_rho = []
              for iteration, draw in enumerate(draws, start=1):
                  rollout_weights = weights.copy()
                  rollout = exp.collect_rollout(
                      rollout_weights, features, labels,
                      draw['contexts'], draw['uniforms']
                  )
                  last_rho = 1.0
                  for indices in np.split(draw['order'], cfg.minibatches):
                      last_rho = exp.population_rho(weights, rollout_weights, features)
                      gradients, _, _ = exp.estimate_gradients(weights, rollout, indices, cfg)
                      weights = weights + cfg.training_learning_rate * gradients[method]
                  values.append(exp.population_value(weights, features, labels))
                  endpoint_rho.append(last_rho)
              return np.asarray(values), np.asarray(endpoint_rho)

          for candidate_id, candidate in enumerate(candidates):
              cfg = exp.Config(
                  rollout_cycles=policy_iterations,
                  rollout_size=candidate['rollout_size'],
                  minibatches=candidate['minibatches'],
                  training_learning_rate=candidate['learning_rate'],
                  ppo_epsilon=candidate['epsilon'],
                  initialization_scale=candidate['init_scale'],
              )
              initial_weights = exp.fit_initial_policy(features, labels, cfg)
              raw_curves = []
              ppo_curves = []
              raw_rhos = []
              for replication in range(replications):
                  rng = np.random.default_rng(seed_start + 10000 * candidate_id + replication)
                  draws = exp.common_randomness(rng, len(features), cfg)
                  raw_values, rho = run_method('raw', initial_weights, draws, cfg)
                  ppo_values, _ = run_method('ppo', initial_weights, draws, cfg)
                  raw_curves.append(raw_values)
                  ppo_curves.append(ppo_values)
                  raw_rhos.append(rho)
                  for iteration in range(policy_iterations + 1):
                      curve_rows.append({
                          'candidate': candidate['name'],
                          'replication': replication,
                          'iteration': iteration,
                          'raw_value': raw_values[iteration],
                          'ppo_value': ppo_values[iteration],
                          'raw_minus_ppo': raw_values[iteration] - ppo_values[iteration],
                          'raw_endpoint_rho': 1.0 if iteration == 0 else rho[iteration - 1],
                      })

              raw = np.asarray(raw_curves)
              ppo = np.asarray(ppo_curves)
              rho = np.asarray(raw_rhos)
              raw_mean = np.mean(raw, axis=0)
              ppo_mean = np.mean(ppo, axis=0)
              gap = raw_mean - ppo_mean
              persistent_cross = -1
              for iteration in range(1, policy_iterations + 1):
                  if np.all(gap[iteration:] < 0.0):
                      persistent_cross = iteration
                      break
              final_diffs = raw[:, -1] - ppo[:, -1]
              summary_rows.append({
                  'candidate': candidate['name'],
                  'rollout_size': cfg.rollout_size,
                  'minibatches': cfg.minibatches,
                  'minibatch_size': cfg.minibatch_size,
                  'learning_rate': cfg.training_learning_rate,
                  'ppo_epsilon': cfg.ppo_epsilon,
                  'initialization_scale': cfg.initialization_scale,
                  'replications': replications,
                  'policy_iterations': policy_iterations,
                  'initial_value': raw_mean[0],
                  'raw_final': raw_mean[-1],
                  'ppo_final': ppo_mean[-1],
                  'final_raw_minus_ppo': float(np.mean(final_diffs)),
                  'final_gap_se': float(np.std(final_diffs, ddof=1) / math.sqrt(replications)),
                  'max_early_raw_advantage': float(np.max(gap[1:11])),
                  'iteration_of_max_raw_advantage': int(np.argmax(gap[1:11]) + 1),
                  'persistent_crossover_iteration': persistent_cross,
                  'early_endpoint_rho': float(np.mean(rho[:, :5])),
                  'late_endpoint_rho': float(np.mean(rho[:, -5:])),
              })
              print(summary_rows[-1])

          result_dir = root/'simulation'/'results'
          with (result_dir/'optdigits_regime_confirm_curves.csv').open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(curve_rows[0].keys()))
              writer.writeheader()
              writer.writerows(curve_rows)
          with (result_dir/'optdigits_regime_confirm_summary.csv').open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(summary_rows[0].keys()))
              writer.writeheader()
              writer.writerows(summary_rows)
          PY
      - name: Commit confirmation and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulation/results/optdigits_regime_confirm_curves.csv simulation/results/optdigits_regime_confirm_summary.csv
          git rm .github/workflows/optdigits-regime-confirm.yml
          git commit -m 'Confirm Optdigits regime candidates'
          git push
