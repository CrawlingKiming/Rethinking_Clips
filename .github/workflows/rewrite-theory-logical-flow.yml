name: Rewrite theory logical flow

on:
  push:
    branches:
      - fix-theory-logical-flow
    paths:
      - scripts/rewrite_theory_logical_flow.py
      - .github/workflows/rewrite-theory-logical-flow.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out rewrite branch
        uses: actions/checkout@v4
        with:
          ref: fix-theory-logical-flow

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rewrite theory
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/rewrite_theory_logical_flow.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('\x0c', '\\f')
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/rewrite_theory_logical_flow.py
          python scripts/rewrite_theory_logical_flow.py

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Commit rewritten paper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.tex
          git diff --cached --quiet && exit 0
          git commit -m "Fix theory logical flow and single-conclusion results"
          git push origin HEAD:fix-theory-logical-flow
