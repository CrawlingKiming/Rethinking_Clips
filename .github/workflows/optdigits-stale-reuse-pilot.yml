name: Run repeated-epoch stale-rollout pilot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r simulation/requirements.txt
      - name: Run repeated-epoch pilot
        run: python simulation/optdigits_stale_reuse_pilot.py
      - name: Commit pilot and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulation/optdigits_stale_reuse_pilot.py simulation/results/optdigits_stale_reuse_pilot.csv
          git rm .github/workflows/optdigits-stale-reuse-pilot.yml
          git commit -m 'Run repeated-epoch stale-rollout pilot'
          git push
