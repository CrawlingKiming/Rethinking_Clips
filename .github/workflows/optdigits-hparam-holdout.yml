name: Validate Optdigits crossover setting

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r simulation/requirements.txt
      - name: Run 100 held-out paired replications
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          import numpy as np
          from simulation import optdigits_categorical_theory as ex

          root = Path.cwd()
          cfg = ex.Config(
              seed=20270826,
              replications=100,
              minibatches=8,
              training_learning_rate=2.5,
          )
          features, labels = ex.load_optdigits(root / 'simulation' / 'data', synthetic=False)
          initial_weights = ex.fit_initial_policy(features, labels, cfg)
          methods = ('raw', 'ppo', 'mse_oracle')
          values = {m: [] for m in methods}
          fractions = {m: [] for m in methods}

          for replication in range(cfg.replications):
              rng = np.random.default_rng(cfg.seed + replication)
              draws = ex.common_randomness(rng, len(features), cfg)
              for method in methods:
                  _, _, summary = ex.run_trajectory(
                      method,
                      initial_weights,
                      features,
                      labels,
                      draws,
                      cfg,
                      replication,
                      0,
                      collect_states=False,
                  )
                  values[method].append(summary['final_value'])
                  fractions[method].append(summary['ppo_fraction'])

          arrays = {m: np.asarray(v, dtype=float) for m, v in values.items()}
          rows = []
          for method in methods:
              arr = arrays[method]
              rows.append({
                  'method': method,
                  'learning_rate': cfg.training_learning_rate,
                  'minibatches': cfg.minibatches,
                  'minibatch_size': cfg.minibatch_size,
                  'replications': cfg.replications,
                  'seed_start': cfg.seed,
                  'mean_final_value': float(np.mean(arr)),
                  'se_final_value': ex.standard_error(arr),
                  'median_final_value': float(np.median(arr)),
                  'mean_ppo_fraction': float(np.mean(fractions[method])),
                  'paired_gain_vs_raw': float(np.mean(arr - arrays['raw'])),
                  'paired_gain_vs_raw_se': ex.standard_error(arr - arrays['raw']),
                  'paired_gain_vs_ppo': float(np.mean(arr - arrays['ppo'])),
                  'paired_gain_vs_ppo_se': ex.standard_error(arr - arrays['ppo']),
              })

          for row in rows:
              print(row)
          out = root / 'simulation' / 'results' / 'optdigits_hparam_holdout.csv'
          with out.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=list(rows[0].keys()))
              writer.writeheader()
              writer.writerows(rows)
          PY
      - name: Commit holdout and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/optdigits-hparam-holdout.yml
          git add simulation/results/optdigits_hparam_holdout.csv
          git add -A .github/workflows
          git commit -m "Add held-out validation for Optdigits crossover setting"
          git push origin HEAD:main
