name: Update main with final Optdigits validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rewrite Optdigits section and appendix
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          root = Path.cwd()

          def read_summary(path):
              out = {}
              for line in path.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  key, value = line.split('=', 1)
                  out[key] = float(value)
              return out

          summary = read_summary(root / 'simulation/results/optdigits_regime_summary.txt')
          with (root / 'simulation/results/optdigits_regime_bins.csv').open(encoding='utf-8') as handle:
              bins = list(csv.DictReader(handle))

          section = r'''
\section{Theoretical validation on Optdigits}
\label{sec:simulation}

We use Optdigits as a finite-population environment in which the population objective, the exact policy gradient, and the mean-squared error of a sampled gradient estimator can all be computed. This lets us test the theory without relying on an ESS threshold or an adaptive update rule. The experiment asks two questions. First, does a loss of effective support increase gradient-estimation error, and can PPO masking reduce that error? Second, does the resulting estimator tradeoff appear in ordinary policy optimization over multiple policy iterations?

\paragraph{Categorical contextual bandit.}
Each handwritten-digit image is a context, the action is one of the ten digit labels, and the reward is one only for the correct class \citep{alpaydin1998optdigits}. The policy is a linear softmax classifier. At each policy iteration, we sample 160 images and one action per image from a frozen rollout policy $Q$. Since the value of an image under $Q$ is exactly $Q(y\mid x)$, the detached advantage is $A=R-Q(y\mid x)$. The rollout is divided into 40 minibatches of four observations, traversed once, and then discarded before the next policy iteration.

\paragraph{The step-size condition is satisfied.}
Appendix~\ref{app:bandit} gives a global smoothness bound for this finite-population objective. For Optdigits, the bound gives $1/\bar L=0.173$. All evaluated policy updates use $\eta=0.17$, so the condition $\eta\le1/\bar L$ required by the improvement argument holds.

\paragraph{Effective support controls estimator reliability.}
We first freeze policy pairs spanning the observed population-ESS range and evaluate the unmodified and PPO-masked estimators at the same states. Figure~\ref{fig:optdigits-theory}(a) shows the exact gradient MSE. At the high-support endpoint, $\rho=1$, PPO is inactive and the two estimators coincide up to the clipping boundary; their median MSEs are $0.531$ and $0.512$. In the lowest-support bin, the median ESS falls to $0.686$, while the unmodified MSE rises to $1.033$. PPO reduces this value to $0.791$ and has lower exact MSE at every retained state in the bin.

This comparison is the estimator-level consequence of Proposition~\ref{prop:clipping-crossover}. Figure~\ref{fig:optdigits-theory}(b) reports the ratio of PPO MSE to unmodified MSE. The ratio approaches one in the high-support regime, where little variance needs to be removed, and falls below one as the rollout becomes less representative of the current policy. PPO therefore becomes useful through a reduction in estimator risk, not merely because a likelihood ratio crosses a fixed numerical boundary.

The same ordering carries to one-step population improvement. In the lowest-support bin, the average objective change is $0.00070$ for the unmodified estimator and $0.00175$ for PPO, while the exact population-gradient direction remains improving. Figure~\ref{fig:optdigits-theory}(c) shows the same comparison across the full ESS range. Thus the controlled experiment directly verifies the chain used in the theory: effective support governs gradient reliability, and gradient reliability governs the quality of the next policy update.

\begin{figure}[htbp]
  \centering
  \includegraphics[width=\linewidth]{figures/optdigits_regime_mechanism.pdf}
  \caption{Estimator-level validation on Optdigits. (a) Exact gradient MSE for the unmodified and PPO-masked estimators across population normalized ESS. (b) PPO MSE relative to unmodified-estimator MSE; values below one indicate that the variance reduction from masking outweighs its bias. (c) One-step population-objective change under the theorem-compliant learning rate.}
  \label{fig:optdigits-theory}
\end{figure}

\paragraph{The estimator tradeoff appears over policy iterations.}
We next compare the two static update rules in ordinary iterative learning. The stress configuration was chosen in a pilot search and then evaluated on a disjoint set of 100 paired replications. Figure~\ref{fig:optdigits-iterations} reports only the population value at the end of each policy iteration, so every point corresponds to a fresh rollout followed by one complete optimization epoch.

The ranking changes over training. The unmodified update learns faster initially and reaches its largest mean advantage over PPO at iteration 3, where the gap is $0.0182$. PPO begins to lead persistently at iteration 10. By iteration 25, the unmodified policy reaches $0.716\pm0.010$, whereas PPO reaches $0.748\pm0.002$; the paired final difference, unmodified minus PPO, is $-0.031\pm0.010$. The endpoint curve therefore exposes the behavior that the one-step analysis predicts: preserving all gradient contributions is beneficial early, while the variance control supplied by masking becomes more valuable later in the optimization path.

\begin{figure}[htbp]
  \centering
  \includegraphics[width=0.78\linewidth]{figures/optdigits_policy_iterations.pdf}
  \caption{Population value at the end of each policy iteration over 100 paired replications. Each point follows a fresh rollout and one optimization epoch. The unmodified estimator learns faster initially, while PPO becomes persistently better after iteration 10. Curves show means and 95\% confidence intervals.}
  \label{fig:optdigits-iterations}
\end{figure}

Optdigits is used only to validate the theoretical mechanism. No ESS threshold, oracle estimator switch, or adaptive clipping rule is defined in this section.
'''.strip()

          table_rows = []
          for row in bins:
              table_rows.append(
                  f"${float(row['rho_median']):.3f}$ & "
                  f"${float(row['raw_mse_median']):.4f}$ & "
                  f"${float(row['ppo_mse_median']):.4f}$ & "
                  f"${float(row['risk_ratio_median']):.3f}$ & "
                  f"${100*float(row['ppo_lower_mse_fraction']):.1f}$ \\\\"
              )

          appendix = r'''
\section{Categorical Optdigits protocol}
\label{app:bandit}

\subsection{Finite population and policy}

Optdigits contains 5,620 labeled handwritten-digit images \citep{alpaydin1998optdigits}. We concatenate the supplied training and test files, divide each of the 64 pixel-count features by 16, and append an intercept. The resulting finite population is $\{(x_j,y_j)\}_{j=1}^M$ with $M=5{,}620$, $x_j\in\mathbb R^{65}$, and $y_j\in\{0,\ldots,9\}$. The policy is a linear softmax model,
\begin{equation}
 \pi_\theta(a\mid x)
 =\frac{\exp(\theta_a^\top x)}{\sum_{c=0}^9\exp(\theta_c^\top x)},
 \qquad a\in\{0,\ldots,9\}.
 \label{eq:categorical-policy}
\end{equation}
The reward is $R(x_j,a)=\mathbf 1\{a=y_j\}$, so the exact population objective and gradient are
\begin{align}
 J(\theta)&=\frac1M\sum_{j=1}^M\pi_\theta(y_j\mid x_j),
 \label{eq:categorical-value}\\
 g(\theta)&=\frac1M\sum_{j=1}^M
 \pi_\theta(y_j\mid x_j)
 \{e_{y_j}-\pi_\theta(\cdot\mid x_j)\}x_j^\top.
 \label{eq:categorical-gradient}
\end{align}
Both are evaluated by summing over the entire finite population. The initial classifier is obtained by supervised fitting and then softened by multiplying its fitted weights by $0.20$.

\subsection{Global smoothness certificate}

Let $p=\operatorname{softmax}(z)$ and $q=p_y$. The Hessian of one correct-class probability with respect to the logits is
\begin{equation}
 \nabla_z^2q
 =q\left[(e_y-p)(e_y-p)^\top-\{\operatorname{diag}(p)-pp^\top\}\right].
\end{equation}
The categorical covariance has operator norm at most $1/2$, which gives
\begin{align}
 \left|\nabla^2J(\theta)[U,U]\right|
 &\le\frac{1}{2M}\sum_{j=1}^M\|Ux_j\|_2^2\\
 &\le\frac12\lambda_{\max}\left(\frac1M\sum_{j=1}^Mx_jx_j^\top\right)\|U\|_F^2.
 \label{eq:categorical-smoothness-bound}
\end{align}
For Optdigits, $\lambda_{\max}=11.549$, so a valid global constant is $\bar L=5.775$ and $1/\bar L=0.173$. The reported experiments use $\eta=0.17$.

\subsection{Sampling and exact estimator risk}

At each policy iteration, we freeze the current policy as $Q$, sample 160 contexts uniformly from the finite population, and sample one action from $Q(\cdot\mid x)$ for each context. Since the reward is exact class match, the exact baseline is $Q(y\mid x)$ and $A=R-Q(y\mid x)$. The rollout is partitioned into 40 minibatches of size $N=4$ and traversed once.

The unmodified estimator is
\begin{equation}
 \widehat g_{\mathrm{raw}}(\theta)
 =\frac1N\sum_{i=1}^N
 \frac{\pi_\theta(a_i\mid x_i)}{Q(a_i\mid x_i)}
 A_i\nabla_\theta\log\pi_\theta(a_i\mid x_i).
 \label{eq:categorical-raw-gradient}
\end{equation}
The PPO estimator applies the standard advantage-dependent mask with radius $0.2$. For $e\in\{\mathrm{raw},\mathrm{PPO}\}$, let $Z_e$ denote one gradient contribution. The exact conditional MSE is
\begin{equation}
 m_e(\theta,Q)
 =\left\|\E_Q[Z_e]-g(\theta)\right\|_2^2
 +\frac1N\E_Q\left\|Z_e-\E_Q[Z_e]\right\|_2^2.
 \label{eq:categorical-exact-risk}
\end{equation}
We compute Equation~\eqref{eq:categorical-exact-risk} exactly by summing over all $5{,}620\times10$ context-action pairs.

\subsection{Frozen-state mechanism experiment}

We retain 48 fixed policy pairs spanning the observed population-ESS range,
\begin{equation}
 \rho(\theta,Q)
 =\left\{\frac1M\sum_{j=1}^M\sum_{a=0}^9
 \frac{\pi_\theta(a\mid x_j)^2}{Q(a\mid x_j)}\right\}^{-1}.
 \label{eq:categorical-population-ess}
\end{equation}
At each pair, the exact MSE is evaluated for minibatch size four. We additionally draw 80 independent minibatches and apply the first 40 sampled directions with the certified step size $0.17$ to measure exact population-objective change.

\begin{table}[htbp]
\centering
\small
\caption{Exact estimator risk across population-ESS bins. PPO/raw is the median MSE ratio; PPO wins is the fraction of retained states in which PPO has smaller exact MSE.}
\label{tab:categorical-ess-bins}
\begin{tabular}{rrrrr}
\toprule
Median ESS & Raw MSE & PPO MSE & PPO/raw & PPO wins (\%) \\
\midrule
@@TABLE_ROWS@@
\bottomrule
\end{tabular}
\end{table}

\subsection{Longitudinal policy-iteration experiment}

The longitudinal comparison uses 25 policy iterations and 100 paired replications. Within a replication, the unmodified and PPO trajectories share context draws, action-sampling uniforms, and minibatch order. Each iteration uses 160 fresh contexts, 40 minibatches of size four, one optimization epoch, and learning rate $0.17$. The configuration was selected in a pilot search using separate random seeds and then evaluated on the reported disjoint replications. No ESS threshold or adaptive estimator selection is used.
'''.strip().replace('@@TABLE_ROWS@@', '\n'.join(table_rows))

          path = root / 'main.tex'
          text = path.read_text(encoding='utf-8')
          sec_start = text.index(r'\section{Theoretical validation on Optdigits}')
          sec_end = text.index(r'\section{Language-model evidence for delayed failure and recovery}')
          text = text[:sec_start] + section + '\n\n' + text[sec_end:]

          app_start = text.index(r'\section{Categorical Optdigits protocol}')
          app_end = text.index(r'\section{Additional RLVR diagnostics}')
          text = text[:app_start] + appendix + '\n\n' + text[app_end:]

          old = ('The categorical contextual bandit validates the theoretical links for both the unmodified and PPO-masked estimators. '
                 'Lower normalized ESS coincides with larger gradient MSE, and harmful updates appear after the realized error reaches the '
                 'population-gradient signal. PPO reduces MSE in the low-support regime but is more distorting in much of the high-support '
                 'regime. A separate 40-update learning curve uses a globally certified step size and shows the corresponding loss of learning '
                 'speed from static masking while support remains broad. No practical threshold-based algorithm is defined in Optdigits.')
          new = ('The categorical contextual bandit validates the theoretical mechanism at both the estimator and optimization levels. '
                 'Lower normalized ESS increases gradient MSE, while PPO reduces estimator risk once effective support becomes limited. '
                 'Across 25 policy iterations, the unmodified update learns faster initially, but PPO becomes persistently better after '
                 'iteration 10 and finishes higher. This controlled result illustrates the paper\'s central regime change without introducing '
                 'an ESS threshold or adaptive switching rule.')
          if old in text:
              text = text.replace(old, new)
          else:
              marker = 'The categorical contextual bandit validates'
              if marker in text:
                  start = text.index(marker)
                  end = text.index('\nFuture work', start)
                  text = text[:start] + new + text[end:]

          if 'optdigits_certified_learning.pdf' in text[sec_start:sec_end]:
              raise RuntimeError('old Optdigits learning figure still present')
          if '—' in text or '---' in text:
              raise RuntimeError('em dash detected')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate numerical statements
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('main.tex').read_text(encoding='utf-8')
          checks = [
              '160 images',
              '40 minibatches of four observations',
              'iteration 10',
              '0.716\\pm0.010',
              '0.748\\pm0.002',
              'figures/optdigits_regime_mechanism.pdf',
              'figures/optdigits_policy_iterations.pdf',
          ]
          for item in checks:
              assert item in text, item
          PY
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      - name: Compile paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.tex
          git rm .github/workflows/update-optdigits-main.yml
          git commit -m 'Update Optdigits theoretical validation in main'
          git push
